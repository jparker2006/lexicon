name: CI

# Every push, one check named CI. A push run also reports on any PR from this
# repo whose head is that commit; adding pull_request would report it twice.
# PRs from forks get no run (there are none).
on: push

# A newer push to a branch cancels its older run, which no longer says anything
# about the head. Runs on main are never cancelled, so each merge keeps its result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: CI
    runs-on: macos-26
    # A green check takes minutes; a hang past this fails instead of holding a macOS runner.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      # The scorer's pinned Python and packages (scorer/uv.lock). The image has no uv.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.23"
      - run: scripts/check.sh
