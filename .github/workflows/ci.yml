name: CI

# Every push, one check named CI. A push run also reports on any PR from this
# repo whose head is that commit; adding pull_request would report it twice.
# PRs from forks get no run (there are none).
on: push

jobs:
  check:
    name: CI
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      # The scorer's pinned Python and packages (scorer/uv.lock). The image has no uv.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.23"
      - run: scripts/check.sh
